name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile etl/*.py
          python -m py_compile data_generation/*.py

      - name: Run tests
        run: pytest -q

      - name: Validate SQL files exist
        run: |
          test -f database/schema.sql
          test -f database/warehouse.sql
          test -f database/views.sql
